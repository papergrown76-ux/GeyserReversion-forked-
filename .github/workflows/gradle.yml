name: Build and release

on:
  push:
    branches: [ouranos]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, for example v2.1.0; leave empty to build only"
        required: false
        type: string
      prerelease:
        description: "Mark a manually published release as a prerelease"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build and run regression tests
        run: bash ./gradlew --no-daemon --max-workers=2 build shadowJar
      - uses: actions/upload-artifact@v4
        with:
          name: GeyserReversion
          path: build/libs/geyserreversion.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GeyserReversion
          path: release
      - name: Publish GitHub release with the extension JAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Use a version tag such as v2.1.0 or v2.1.0-beta.1"
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          Original GeyserReversion by Oryxel / oryxel1. Fork maintained by papergrown76-ux.
          This fork's compatibility changes, tests, and documentation were modified with OpenAI Codex (AI).

          Built with Java 21 and checked by the automated regression suite. See README.md for supported Geyser versions and gameplay-testing limitations.

          Asset: geyserreversion.jar only. No SHA-256 checksum files are attached.
          NOTES
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/geyserreversion.jar \
            --target "$GITHUB_SHA" --title "GeyserReversion $RELEASE_TAG" \
            --notes-file release-notes.md "${flags[@]}"
